# winget singleton manifest for Sindook.
#
# IMPORTANT: `InstallerSha256` below is a placeholder and MUST be filled at
# release time (see docs/RELEASING.md). Compute the SHA-256 of the published
# Windows archives, e.g. with PowerShell:
#   Get-FileHash -Algorithm SHA256 sindook_0.6.0_windows_amd64.zip
# The commented-out `ReleaseDate` must also be set to the tag date before
# submitting this manifest to winget-pkgs.
PackageIdentifier: ruddro-roy.sindook
PackageVersion: 0.6.0
PackageLocale: en-US
Publisher: Ruddro Roy
PublisherUrl: https://github.com/ruddro-roy
PublisherSupportUrl: https://github.com/ruddro-roy/sindook/issues
Author: Ruddro Roy
PackageName: sindook
PackageUrl: https://github.com/ruddro-roy/sindook
License: Apache-2.0
LicenseUrl: https://github.com/ruddro-roy/sindook/blob/v0.6.0/LICENSE
Copyright: Copyright 2026 Ruddro Roy
ShortDescription: "Hybrid post-quantum file encryption (X-Wing: X25519 + ML-KEM-768)"
Description: |-
  Sindook is a command-line tool that seals files with hybrid post-quantum
  encryption using the X-Wing KEM (X25519 + ML-KEM-768) and can rotate
  recipients, passphrases, and format versions without decrypting or
  re-encrypting the payload in fast mode. Pre-1.0 software: the format and
  design have not received an independent security audit.
Moniker: sindook
Tags:
  - cli
  - encryption
  - post-quantum
  - pqc
  - x-wing
  - ml-kem
# ReleaseDate: 0001-01-01  <- set to the v0.6.0 tag date at release time
ReleaseNotesUrl: https://github.com/ruddro-roy/sindook/releases/tag/v0.6.0
Installers:
  - Architecture: x64
    InstallerType: portable
    InstallerUrl: https://github.com/ruddro-roy/sindook/releases/download/v0.6.0/sindook_0.6.0_windows_amd64.zip
    # REQUIRED at release time: SHA-256 of sindook_0.6.0_windows_amd64.zip
    InstallerSha256: <FILL_AT_RELEASE_TIME>
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: sindook.exe
        PortableCommandAlias: sindook
  - Architecture: arm64
    InstallerType: portable
    InstallerUrl: https://github.com/ruddro-roy/sindook/releases/download/v0.6.0/sindook_0.6.0_windows_arm64.zip
    # REQUIRED at release time: SHA-256 of sindook_0.6.0_windows_arm64.zip
    InstallerSha256: <FILL_AT_RELEASE_TIME>
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: sindook.exe
        PortableCommandAlias: sindook
ManifestType: singleton
ManifestVersion: 1.6.0
