# Reproducible, signed releases: CGO off, trimmed paths, commit timestamps,
# syft SBOM per archive, cosign keyless signature over the checksums.
version: 2

project_name: sindook

builds:
  - main: ./cmd/sindook
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*

nfpms:
  - id: packages
    package_name: sindook
    file_name_template: "sindook_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Ruddro Roy
    homepage: https://github.com/ruddro-roy/sindook
    maintainer: Ruddro Roy <roy@ruddro.com>
    description: Hybrid post-quantum file encryption with key rotation built in. Sindook is the Bengali word for a strongbox.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/sindook/LICENSE
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^ci"
