# Reproducible, signed releases: CGO off, trimmed paths, commit timestamps,
# syft SBOM per archive, cosign keyless signature over the checksums.
version: 2

project_name: sindook

# The GitHub release is created as a DRAFT. The release workflow's verify job
# re-checks the staged artifacts and only then promotes the draft to public,
# so a release can never be published without passing every gate.
release:
  draft: true

# Windows executables carry a VERSIONINFO resource and application manifest
# (generated as .syso files the Go linker picks up by filename). Unsigned Go
# binaries without publisher metadata are routinely flagged by Microsoft
# Defender's ML heuristics (see winget-pkgs PR #425225); embedding identity
# metadata is the strongest mitigation short of Authenticode signing.
# The go-winres version is pinned; scripts/verify-reproducibility.sh must use
# the same version to reproduce Windows binaries byte-for-byte.
before:
  hooks:
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in packaging/winres/winres.json --out cmd/sindook/rsrc --arch amd64,arm64 --file-version {{ .Version }} --product-version {{ .Version }}

builds:
  - main: ./cmd/sindook
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Windows keeps the symbol table and DWARF: stripped (-s -w) unsigned
    # binaries score worse with antivirus heuristics, and symbols let the
    # Defender team analyze false-positive submissions. Other platforms stay
    # stripped for size.
    ldflags:
      - '{{ if ne .Os "windows" }}-s -w {{ end }}-X main.version={{ .Version }}'
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*

nfpms:
  - id: packages
    package_name: sindook
    file_name_template: "sindook_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Ruddro Roy
    homepage: https://github.com/ruddro-roy/sindook
    maintainer: Ruddro Roy <roy@ruddro.com>
    description: Hybrid post-quantum file encryption with key rotation built in. Sindook is the Bengali word for a strongbox.
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/sindook/LICENSE
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^ci"
