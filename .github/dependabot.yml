version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directories:
      - /
      - /interop
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
        group-by: dependency-name
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Go toolchain bumps must be coordinated with go.mod and the fuzz
      # Dockerfiles; scripts/check-fuzz-build.sh enforces that manually.
      - dependency-name: "golang"
