name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  batch-fuzzing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
      - name: Preflight corpus storage
        run: |
          set -euo pipefail
          storage_repo='https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ruddro-roy/sindook.git'
          before="$(GIT_TERMINAL_PROMPT=0 git ls-remote "$storage_repo" refs/heads/corpora | cut -f1)"
          if [ -z "$before" ]; then
            echo "::error::the corpora branch is missing on origin"
            exit 1
          fi
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          GIT_TERMINAL_PROMPT=0 git clone --quiet --depth=1 --branch corpora "$storage_repo" "$scratch/repo"
          GIT_TERMINAL_PROMPT=0 git -C "$scratch/repo" push --dry-run origin HEAD:refs/heads/corpora
          echo "CORPUS_BEFORE=$before" >> "$GITHUB_ENV"
      - name: Run fuzzers
        id: run
        continue-on-error: true
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
          output-sarif: true
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ruddro-roy/sindook.git
          storage-repo-branch: corpora
      - name: Classify first fuzzing failure
        id: batch-failure
        if: steps.run.outcome == 'failure'
        run: |
          set -euo pipefail
          real_crash=false
          if [ -d out/artifacts ] && find out/artifacts -type f \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' \) -print -quit | grep -q .; then
            real_crash=true
          fi
          echo "real_crash=$real_crash" >> "$GITHUB_OUTPUT"
      - name: Keep real crash failures unretried
        if: steps.batch-failure.outputs.real_crash == 'true'
        run: |
          echo "::error::fuzzer crash artifact exists; refusing to retry and hide a real finding"
          exit 1
      # The action can fail on transient runner/storage conditions after no
      # testcase was saved. Retry only that infra class; never retry after a
      # crash artifact exists, because a second pass may not rediscover it.
      - name: Reset run artifacts
        if: steps.batch-failure.outputs.real_crash == 'false'
        run: rm -rf "${GITHUB_WORKSPACE}/out/artifacts"
      - name: Run fuzzers (infra retry)
        if: steps.batch-failure.outputs.real_crash == 'false'
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 1800
          mode: batch
          sanitizer: address
          output-sarif: true
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ruddro-roy/sindook.git
          storage-repo-branch: corpora
      - name: Upload crash artifacts
        if: always() && steps.build.outcome == 'success' && hashFiles('out/artifacts/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cflite-batch-crashes
          path: out/artifacts
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload SARIF
        if: always() && steps.build.outcome == 'success' && hashFiles('cifuzz-sarif/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
      - name: Report corpus storage result
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          storage_repo='https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ruddro-roy/sindook.git'
          after="$(GIT_TERMINAL_PROMPT=0 git ls-remote "$storage_repo" refs/heads/corpora | cut -f1)"
          if [ -z "$after" ]; then
            echo "::error::the corpora branch disappeared from origin"
            exit 1
          fi
          if [ "$after" = "${CORPUS_BEFORE:-}" ]; then
            echo "::warning::the corpora branch did not advance; all targets may have found no new inputs"
          else
            echo "corpus advanced: ${CORPUS_BEFORE:0:12} -> ${after:0:12}"
          fi
  pruning:
    runs-on: ubuntu-latest
    needs: batch-fuzzing
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: go
          sanitizer: address
      # fuzz-seconds is the total budget, divided across every target with
      # unused time rolling forward to later ones. The cap stays deliberately
      # high because prune exits early on healthy corpora but needs enough room
      # for slow ASan merges as the persistent corpus grows.
      - name: Prune corpus
        id: run
        continue-on-error: true
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 7200
          mode: prune
          sanitizer: address
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ruddro-roy/sindook.git
          storage-repo-branch: corpora
      - name: Classify prune failure
        id: prune-failure
        if: steps.run.outcome == 'failure'
        run: |
          set -euo pipefail
          real_crash=false
          if [ -d out/artifacts ] && find out/artifacts -type f \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' \) -print -quit | grep -q .; then
            real_crash=true
          fi
          echo "real_crash=$real_crash" >> "$GITHUB_OUTPUT"
      - name: Keep prune evidence unretried
        if: steps.prune-failure.outputs.real_crash == 'true'
        run: |
          echo "::error::prune produced a crash-like artifact; refusing to retry and clear evidence"
          exit 1
      # Prune can die on transient runner/storage conditions. Retry only when
      # no crash-like artifact was saved; if a future prune failure creates
      # evidence, keep the first failure intact instead of clearing it.
      - name: Reset prune artifacts
        if: steps.prune-failure.outputs.real_crash == 'false'
        run: rm -rf "${GITHUB_WORKSPACE}/out/artifacts"
      - name: Prune corpus (infra retry)
        if: steps.prune-failure.outputs.real_crash == 'false'
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 7200
          mode: prune
          sanitizer: address
          storage-repo: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ruddro-roy/sindook.git
          storage-repo-branch: corpora
