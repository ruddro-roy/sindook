# Installs a real released binary through the user-facing installers on
# actual runner hosts and exercises it end to end. Catches broken releases,
# asset naming mistakes, and installer regressions that syntax checks
# cannot. The weekly schedule revalidates the latest release continuously.
name: installer-validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/installer-validation.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/installer-validation.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: install and exercise (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release (unix)
        if: runner.os != 'Windows'
        run: |
          sh scripts/install.sh --install-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install release (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sindook-bin'
          pwsh -File scripts/install.ps1 -InstallDir $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Exercise the installed binary
        shell: bash
        run: |
          set -eu
          sindook version
          sindook selftest
          work="$(mktemp -d)"
          cd "$work"
          sindook init
          sindook doctor
          printf 'installer validation payload\n' > secret.txt
          sindook seal secret.txt
          rm secret.txt
          sindook open secret.txt.sindook
          test "$(cat secret.txt)" = 'installer validation payload'
          echo "installer validation round trip OK on $(uname -s)/$(uname -m)"
  tagged-module:
    name: go install from tag
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the latest release tag
        id: tag
        run: |
          url=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/ruddro-roy/sindook/releases/latest)
          tag=${url##*/}
          case "$tag" in
            v*) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) echo "no release resolved (got '$tag')" >&2; exit 1 ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install and verify the module path
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          go install "github.com/ruddro-roy/sindook/cmd/sindook@${TAG}"
          want="sindook ${TAG#v}"
          got="$(sindook version)"
          case "$got" in
            "$want"|"$want ("*) echo "module install OK: $got" ;;
            *) echo "version mismatch: got '$got', want '$want'" >&2; exit 1 ;;
          esac
          sindook selftest >/dev/null
