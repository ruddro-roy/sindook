name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: interop
        run: cd interop && go vet ./... && go test ./...
      - name: bounded-io gate
        # The whole point of format v3: a rotation must touch a fixed number
        # of bytes. These cases run at 1 MiB, 1 GiB and a sparse 100 GiB and
        # fail if the byte counts move.
        run: go test ./internal/box -run '^TestRewrapAt|^TestInterruptedRotation$|^TestMigrateRoundTrip' -count=1 -v
      - name: rotation benchmark
        run: |
          go test ./internal/box -run '^$' -bench '^BenchmarkRewrapAt$' -benchtime 20x | tee bench.txt
          python3 - <<'PY'
          import re, sys
          rows = {}
          for line in open("bench.txt"):
              m = re.match(r"BenchmarkRewrapAt/payload=(\d+)MiB\S*\s+\d+\s+(\d+) ns/op\s+(\d+) bytes_read/op\s+(\d+) bytes_written/op", line)
              if m:
                  rows[int(m[1])] = (int(m[3]), int(m[4]))
          if len(rows) < 2:
              sys.exit("benchmark produced no comparable rows")
          costs = set(rows.values())
          if len(costs) != 1:
              sys.exit(f"rotation cost varies with payload size: {rows}")
          print(f"bounded: every payload size cost {costs.pop()} (bytes read, bytes written)")
          PY
          {
            echo '### Rotation cost'
            echo
            echo 'Bytes read, bytes written and syncs must not vary with payload size.'
            echo
            echo '```'
            grep BenchmarkRewrapAt bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: fuzz smoke
        run: |
          for target in FuzzOpen FuzzOpenPassphrase FuzzSealOpenRoundTrip FuzzBitFlip \
                        FuzzOpenV3 FuzzInspectV3 FuzzArenaMutation FuzzRewrapAtArena; do
            go test ./internal/box -run='^$' -fuzz="^${target}\$" -fuzztime=30s
          done
          go test ./xwing -run='^$' -fuzz='^FuzzDecapsulate$' -fuzztime=30s
          go test ./internal/armor -run='^$' -fuzz='^FuzzArmor$' -fuzztime=30s
      - name: timing
        run: SINDOOK_TIMING=1 go test ./xwing -run '^TestDecapsulationTiming$' -count=1 -v
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
