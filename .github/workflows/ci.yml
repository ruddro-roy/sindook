name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            interop/go.sum
      - name: build
        timeout-minutes: 5
        run: go build ./...
      - name: test
        timeout-minutes: 10
        run: go test -count=1 ./...
      - name: test interoperability module
        timeout-minutes: 5
        working-directory: interop
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            /tmp/*.log
          retention-days: 7
          if-no-files-found: ignore

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            interop/go.sum
      - name: allow mlock (best-effort)
        timeout-minutes: 1
        run: |
          ulimit -l unlimited || true
          ulimit -l || true
          cat /proc/meminfo | head -n 20 || true
      - name: race (main module)
        timeout-minutes: 10
        env:
          GOMAXPROCS: "2"
        run: go test -race -count=1 ./...
      - name: race (interop)
        timeout-minutes: 5
        working-directory: interop
        env:
          GOMAXPROCS: "2"
        run: go test -race -count=1 ./...
      - name: upload race logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-logs
          path: |
            /tmp/*.log
          retention-days: 7
          if-no-files-found: ignore

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            interop/go.sum
      - name: cache fuzz corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            box/testdata/fuzz
            xwing/testdata/fuzz
            internal/armor/testdata/fuzz
            ~/.cache/go
          key: fuzz-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            fuzz-${{ runner.os }}-
      - name: gofmt
        timeout-minutes: 2
        run: |
          git ls-files -z -- '*.go' | xargs -0 gofmt -l > /tmp/gofmt.out
          if test -s /tmp/gofmt.out; then
            cat /tmp/gofmt.out
            exit 1
          fi
      - name: vet
        timeout-minutes: 5
        run: go vet ./...
      - name: whitespace check
        timeout-minutes: 2
        run: |
          # The checkout in CI is always a clean tree, so this detects
          # whitespace errors introduced by the change under test.
          git diff --check
          if grep -RIn --include='*.go' -E '[[:blank:]]+$' .; then
            echo "::error::trailing whitespace found in Go sources"
            exit 1
          fi
      - name: version consistency
        timeout-minutes: 2
        run: |
          # scripts/check-version-consistency.sh derives the expected
          # version from the source-tree dev default and verifies that
          # man pages, packaging manifests and install scripts agree.
          if [ ! -f scripts/check-version-consistency.sh ]; then
            echo "::error::scripts/check-version-consistency.sh not found"
            exit 1
          fi
          bash scripts/check-version-consistency.sh
      - name: cross-compile
        timeout-minutes: 5
        run: |
          set -eu
          for goos in linux darwin windows freebsd openbsd netbsd; do
            for goarch in amd64 arm64; do
              echo "==> building for ${goos}/${goarch}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build ./...
            done
          done
          for goos in linux windows; do
            echo "==> building for ${goos}/386"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="386" go build ./...
          done
      - name: fuzz smoke
        timeout-minutes: 10
        run: |
          for target in FuzzOpenRecipient FuzzOpenPassphrase FuzzSealOpenRoundTrip FuzzBitFlip; do
            go test ./box -run='^$' -fuzz="^${target}\$" -fuzztime=30s -count=1
          done
          go test ./xwing -run='^$' -fuzz='^FuzzDecapsulate$' -fuzztime=30s -count=1
          go test ./internal/armor -run='^$' -fuzz='^FuzzArmor$' -fuzztime=30s -count=1
      - name: timing
        timeout-minutes: 5
        run: SINDOOK_TIMING=1 go test ./xwing -run '^TestDecapsulationTiming$' -count=1 -v
      - name: govulncheck
        timeout-minutes: 5
        run: |
          # Retry up to 3 times to tolerate vuln DB network flakes while keeping
          # the check required (fails if vulnerability is real).
          for i in 1 2 3; do
            echo "govulncheck attempt $i/3"
            if go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...; then
              exit 0
            fi
            ec=$?
            echo "::warning::govulncheck attempt $i failed with exit $ec, retrying in 5s..."
            sleep 5
            if [ "$i" -eq 3 ]; then
              exit $ec
            fi
          done
      - name: upload quality logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-logs
          path: |
            /tmp/gofmt.out
            /tmp/*.log
          retention-days: 7
          if-no-files-found: ignore
