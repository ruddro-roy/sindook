name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: test interoperability module
        working-directory: interop
        run: |
          go vet ./...
          go test ./...

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          git ls-files -z -- '*.go' | xargs -0 gofmt -l > /tmp/gofmt.out
          if test -s /tmp/gofmt.out; then
            cat /tmp/gofmt.out
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: race
        run: go test -race ./...
      - name: cross-compile
        run: |
          set -eu
          for goos in linux darwin windows freebsd openbsd netbsd; do
            for goarch in amd64 arm64; do
              echo "==> building for ${goos}/${goarch}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build ./...
            done
          done
      - name: fuzz smoke
        run: |
          for target in FuzzOpenRecipient FuzzOpenPassphrase FuzzSealOpenRoundTrip FuzzBitFlip; do
            go test ./internal/box -run='^$' -fuzz="^${target}\$" -fuzztime=30s
          done
          go test ./xwing -run='^$' -fuzz='^FuzzDecapsulate$' -fuzztime=30s
          go test ./internal/armor -run='^$' -fuzz='^FuzzArmor$' -fuzztime=30s
      - name: timing
        run: SINDOOK_TIMING=1 go test ./xwing -run '^TestDecapsulationTiming$' -count=1 -v
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-package: ./...
