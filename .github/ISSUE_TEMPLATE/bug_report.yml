name: Bug report
description: Report reproducible behavior that differs from the documented command behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private keys, passphrases, plaintext, or real encrypted files. For a security issue, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Sindook version
      description: Include the output of `sindook version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64, Ubuntu 24.04 amd64, Windows 11 amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Sanitized command and input description
      description: Remove every secret and use a small synthetic file where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
    validations:
      required: true
